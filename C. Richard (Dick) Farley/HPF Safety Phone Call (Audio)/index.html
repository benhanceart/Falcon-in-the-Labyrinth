<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPF Safety Phone Call (Audio)</title>
    <style>
        /* Clean, Readable Retro Monospace Typography */
        @import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --bg-color: #050508;          /* Deep obsidian background */
            --card-bg: #0e0e14;          /* Soft dark container background */
            --text-color: #e6e6e6;        /* Clean off-white text for easy reading */
            --heading-color: #ffffff;     /* Pure white headings */
            --accent-color: #99ccff;      /* Soft blue accent for links */
            --hover-color: #ffffff;       /* Pure white hover highlight */
            --border-color: #222233;      /* Subtle dark border frame */
            --muted-text: #9090a0;       /* Muted gray text for captions */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Space Mono', 'Courier Prime', 'Courier New', monospace;
            font-size: 1.05rem;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 2rem 1.5rem;
            max-width: 900px;
            margin: 0 auto;
        }

        /* Breadcrumb Navigation Line */
        nav.breadcrumbs {
            font-size: 0.95rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            margin-bottom: 2rem;
            color: var(--muted-text);
        }

        nav.breadcrumbs a {
            color: var(--accent-color);
            text-decoration: underline;
        }

        nav.breadcrumbs a:hover {
            color: var(--hover-color);
        }

        /* Header & Hero Banner */
        header.page-header {
            text-align: center;
            border: 1px solid var(--border-color);
            background: var(--card-bg);
            padding: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .hero-banner {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
        }

        header.page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--heading-color);
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        /* Text Content Box */
        .text-content {
            background: #000000;
            border: 1px solid var(--border-color);
            padding: 1.25rem;
            font-size: 1rem;
            color: var(--text-color);
            text-align: left;
            white-space: pre-wrap;
            margin-top: 1rem;
        }

        section {
            margin-bottom: 2.5rem;
        }

        /* Subfolder Navigation Grid */
        .folder-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1rem;
        }

        .folder-card {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.8rem 1rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--accent-color);
            text-decoration: none;
            font-size: 1rem;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .folder-card:hover {
            border-color: var(--accent-color);
            color: var(--hover-color);
        }

        /* Photos Section (Inline Embedded Files) */
        .image-gallery {
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .image-embed-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.8rem;
        }

        .image-embed-card img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid var(--border-color);
        }

        .image-embed-card .caption {
            margin-top: 0.6rem;
            font-size: 0.9rem;
            color: var(--muted-text);
            text-align: center;
        }

        /* Video & Audio Sections */
        .video-list, .audio-list {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .video-card, .audio-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1rem;
        }

        .video-card video, .audio-card audio {
            width: 100%;
        }

        .video-card p, .audio-card span {
            margin-top: 0.5rem;
            color: var(--text-color);
            font-size: 0.95rem;
        }
    </style>
</head>

    <nav class="breadcrumbs"><a href="../../index.html">Falcon in the Labyrinth</a> / <a href="../index.html">C. Richard (Dick) Farley</a> / <span>HPF Safety Phone Call (Audio)</span></nav>

    <header class="page-header">
        
        <h1>HPF Safety Phone Call (Audio)</h1>

<div class="audio-card">

</body>
</html>
